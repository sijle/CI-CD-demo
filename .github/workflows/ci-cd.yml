name: CI/CD Pipeline

# 触发条件：当 push 到 main 分支，或创建 PR 到 main 分支时
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 环境变量（需要替换 dockerhub-username 为你的实际用户名）
env:
  DOCKER_IMAGE: lesj163/flask-cicd-demo
  DOCKER_TAG: latest

# 定义要执行的任务
jobs:
  # 任务1：测试
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
      
      - name: 运行测试
        run: |
          pytest test_app.py -v
  
  # 任务2：构建并推送 Docker 镜像（仅在 main 分支 push 时执行）
  build:
    needs: test  # 等 test 任务成功后才执行
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      
      - name: 登录 Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 构建镜像
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} ${{ env.DOCKER_IMAGE }}:$(date +%Y%m%d-%H%M%S)
      
      - name: 推送到 Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          docker push ${{ env.DOCKER_IMAGE }}:$(date +%Y%m%d-%H%M%S)
